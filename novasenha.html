<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iFSports - Nova senha</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/recuperar.css">

</head>


<body>

<div id="loginPage">

    <div class="login-container">

        <!-- LADO ESQUERDO -->

        <div class="login-left">

            <div class="login-logo">
                <span>IF</span>Sports
            </div>

            <h1>
                Quase lá.
                <br>
                Crie sua <span>nova senha.</span>
            </h1>

            <p>
                Escolha uma senha que você consiga lembrar
                e volte a acompanhar seus treinos
                e modalidades.
            </p>

            <div class="login-sports">

                <div>⚽</div>
                <div>🏀</div>
                <div>🏐</div>
                <div>🏓</div>

            </div>

        </div>


        <!-- LADO DIREITO -->

        <div class="login-right">

            <h2>Nova senha</h2>

            <p class="login-description">
                Digite sua nova senha e repita para confirmar.
            </p>

            <div class="input-group">

                <label for="novaSenha">Digite sua nova senha</label>

                <input
                type="password"
                id="novaSenha"
                placeholder="Mínimo de 8 caracteres"
                autocomplete="new-password">

            </div>

            <div class="input-group">

                <label for="repetirSenha">Repita sua senha</label>

                <input
                type="password"
                id="repetirSenha"
                placeholder="Digite a senha novamente"
                autocomplete="new-password">

            </div>

            <button
            id="botaoSalvar"
            class="login-button"
            onclick="salvarSenha()">

                Salvar nova senha

            </button>

            <p id="mensagem"></p>

            <a class="esquecisenha" href="index.html">Voltar para o login</a>

        </div>

    </div>

</div>

<script src="js/novasenha.js"></script>

</body>

</html>
